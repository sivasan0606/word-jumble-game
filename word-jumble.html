<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Jumble Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .game-container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #2c3e50;
        }

        .score-container {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
            color: #8e44ad;
        }

        .difficulty-container {
            margin-bottom: 20px;
        }

        .difficulty-btn {
            background-color: #eee;
            border: 1px solid #ccc;
            padding: 5px 10px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .difficulty-btn.active {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }

        .jumbled-word {
            font-size: 2.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 20px 0;
            color: #3498db;
            word-wrap: break-word;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background-color: #3498db;
            color: #fff;
        }

        .hint-container {
            margin-top: 15px;
            min-height: 50px;
        }

        #hint-text {
            font-style: italic;
            color: #666;
            margin-top: 10px;
            display: none;
        }

        .btn-action {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
        }

        .btn-action:hover {
            background-color: #27ae60;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            height: 20px;
        }

        .firecracker-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .firecracker {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: explode 1.5s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(10) translateY(100px);
                opacity: 0;
            }
        }

        .correct {
            color: #27ae60;
        }

        .wrong {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Word Jumble</h1>
        <div class="difficulty-container">
            <button class="difficulty-btn active" onclick="setDifficulty('simple')">Simple</button>
            <button class="difficulty-btn" onclick="setDifficulty('medium')">Medium</button>
            <button class="difficulty-btn" onclick="setDifficulty('complex')">Complex</button>
        </div>
        <div class="score-container">Score: <span id="score">0</span></div>
        <div id="jumbled-word" class="jumbled-word">LOADING...</div>

        <div class="options-container" id="options">
            <!-- Options will be injected here -->
        </div>

        <div class="hint-container">
            <button class="btn-action" id="hint-btn">Show Hint</button>
            <p id="hint-text"></p>
        </div>

        <div id="message"></div>
        <button class="btn-action" id="next-btn" style="display: none;">Next Word</button>
    </div>

    <div class="firecracker-container" id="firecracker-container"></div>

    <script>
        const wordList = {
            simple: [
                { word: "bird", hint: "A creature that flies" },
                { word: "fish", hint: "Lives in water" },
                { word: "tree", hint: "A tall plant with a trunk" },
                { word: "moon", hint: "Shines at night" },
                { word: "fire", hint: "Hot and glowing" },
                { word: "book", hint: "Something you read" },
                { word: "frog", hint: "A jumping amphibian" },
                { word: "star", hint: "Twinkles in the sky" },
                { word: "cake", hint: "Sweet dessert" },
                { word: "lion", hint: "King of the jungle" }
            ],
            medium: [
                { word: "banana", hint: "A long yellow fruit" },
                { word: "orange", hint: "A round citrus fruit" },
                { word: "guitar", hint: "Has strings and music" },
                { word: "planet", hint: "Orbits a star" },
                { word: "silver", hint: "A shiny gray metal" },
                { word: "window", hint: "Look through it" },
                { word: "puzzle", hint: "Needs to be solved" },
                { word: "bridge", hint: "Crosses over water" },
                { word: "camera", hint: "Takes photographs" },
                { word: "garden", hint: "Place with flowers" }
            ],
            complex: [
                { word: "elephant", hint: "Largest land animal" },
                { word: "computer", hint: "Digital processor" },
                { word: "mountain", hint: "Very high hill" },
                { word: "treasure", hint: "Hidden riches" },
                { word: "umbrella", hint: "Protects from rain" },
                { word: "dinosaur", hint: "Extinct reptile" },
                { word: "keyboard", hint: "Used for typing" },
                { word: "backpack", hint: "Carried on shoulders" },
                { word: "sandwich", hint: "Bread with filling" },
                { word: "football", hint: "A popular ball game" }
            ]
        };

        let currentDifficulty = 'simple';
        let usedWords = [];
        let correctStreak = 0;
        let score = 0;
        let currentWord = "";

        function jumbleWord(word) {
            let letters = word.split('');
            for (let i = letters.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }
            // Ensure jumbled word is not same as original
            if (letters.join('') === word && word.length > 1) {
                return jumbleWord(word);
            }
            return letters.join('');
        }

        function getRandomWord() {
            const availableWords = wordList[currentDifficulty].filter(item => !usedWords.includes(item.word));

            if (availableWords.length === 0) {
                usedWords = []; // Reset if all words used
                return getRandomWord();
            }

            const randomIndex = Math.floor(Math.random() * availableWords.length);
            const selected = availableWords[randomIndex];
            usedWords.push(selected.word);
            return selected;
        }

        function generateOptions(correctAnswer) {
            let options = [correctAnswer];
            const allPossibleWords = wordList[currentDifficulty].map(item => item.word);

            while (options.length < 4) {
                let randomWord = allPossibleWords[Math.floor(Math.random() * allPossibleWords.length)];
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }
            // Shuffle options
            for (let i = options.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            return options;
        }

        function setDifficulty(difficulty) {
            currentDifficulty = difficulty;
            usedWords = [];
            correctStreak = 0;

            // Update UI
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase() === difficulty) {
                    btn.classList.add('active');
                }
            });

            initGame();
        }

        function showFirecrackers() {
            const container = document.getElementById('firecracker-container');
            const colors = ['#f1c40f', '#e67e22', '#e74c3c', '#9b59b6', '#3498db', '#2ecc71'];

            for (let i = 0; i < 50; i++) {
                const firecracker = document.createElement('div');
                firecracker.className = 'firecracker';
                firecracker.style.left = Math.random() * 100 + 'vw';
                firecracker.style.top = Math.random() * 100 + 'vh';
                firecracker.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(firecracker);

                // Remove after animation
                setTimeout(() => {
                    firecracker.remove();
                }, 1500);
            }
        }

        function handleSelection(selectedWord, correctWord) {
            const messageEl = document.getElementById("message");
            const nextBtn = document.getElementById("next-btn");
            const optionButtons = document.querySelectorAll(".option-btn");

            optionButtons.forEach(btn => btn.disabled = true);

            if (selectedWord === correctWord) {
                score += 10;
                correctStreak++;
                document.getElementById("score").innerText = score;
                messageEl.innerText = "Correct! +10 points";
                messageEl.className = "correct";

                if (correctStreak === 3) {
                    messageEl.innerText += " - Awesome! 3 in a row! 🎉";
                    showFirecrackers();
                    correctStreak = 0; // Reset streak after reward
                }
            } else {
                messageEl.innerText = `Wrong! The correct word was ${correctWord.toUpperCase()}.`;
                messageEl.className = "wrong";
                correctStreak = 0; // Reset streak on wrong answer
            }

            nextBtn.style.display = "inline-block";
        }

        function initGame() {
            const wordData = getRandomWord();
            currentWord = wordData.word;
            const jumbled = jumbleWord(currentWord);
            const options = generateOptions(currentWord);

            document.getElementById("jumbled-word").innerText = jumbled;
            document.getElementById("hint-text").innerText = `Hint: ${wordData.hint}`;
            document.getElementById("hint-text").style.display = "none";
            document.getElementById("message").innerText = "";
            document.getElementById("next-btn").style.display = "none";

            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => handleSelection(opt, currentWord);
                optionsContainer.appendChild(btn);
            });
        }

        document.getElementById("hint-btn").onclick = () => {
            document.getElementById("hint-text").style.display = "block";
        };

        document.getElementById("next-btn").onclick = initGame;

        window.onload = initGame;
    </script>
</body>
</html>
